<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Interactive Trilingual Grammar Engine</title>
  <style>
    :root {
      --bg-color: #0b0f19;
      --card-bg: rgba(23, 31, 51, 0.7);
      --card-border: rgba(255, 255, 255, 0.1);
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
      --accent-pao: #10b981;
      --accent-my: #f59e0b;
      --accent-en: #3b82f6;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      padding: 30px 15px;
      display: flex;
      justify-content: center;
    }

    .container { max-width: 850px; width: 100%; }
    
    header { text-align: center; margin-bottom: 25px; }
    h1 {
      font-size: 2.2rem;
      background: linear-gradient(135deg, #a7f3d0, #3b82f6);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 8px;
    }

    /* Search Box Styles */
    .search-box {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 25px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.3);
    }

    .input-group {
      display: flex;
      gap: 10px;
      margin-bottom: 15px;
    }

    input[type="text"] {
      flex: 1;
      background: #050811;
      border: 1px solid var(--card-border);
      border-radius: 8px;
      padding: 12px 16px;
      color: #fff;
      font-size: 1rem;
      outline: none;
    }

    input[type="text"]:focus {
      border-color: #3b82f6;
      box-shadow: 0 0 8px rgba(59, 130, 246, 0.4);
    }

    button {
      background: linear-gradient(135deg, #2563eb, #1d4ed8);
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 12px 24px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s;
    }

    button:hover { opacity: 0.9; }

    .quick-tags {
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    .tag-btn {
      background: rgba(255,255,255,0.05);
      border: 1px solid var(--card-border);
      border-radius: 15px;
      padding: 4px 12px;
      color: #d1d5db;
      cursor: pointer;
      font-size: 0.8rem;
    }

    .tag-btn:hover { background: rgba(255,255,255,0.15); }

    /* Results Cards */
    .card {
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 18px;
      margin-bottom: 15px;
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--card-border);
      padding-bottom: 10px;
      margin-bottom: 12px;
    }

    .badge {
      font-size: 0.75rem;
      padding: 4px 10px;
      border-radius: 4px;
      font-weight: bold;
    }

    .pao .badge { background: rgba(16, 185, 129, 0.2); color: var(--accent-pao); border: 1px solid var(--accent-pao); }
    .my .badge { background: rgba(245, 158, 11, 0.2); color: var(--accent-my); border: 1px solid var(--accent-my); }
    .en .badge { background: rgba(59, 130, 246, 0.2); color: var(--accent-en); border: 1px solid var(--accent-en); }

    pre {
      background: #050811;
      padding: 14px;
      border-radius: 8px;
      color: #e5e7eb;
      font-size: 1.1rem;
      margin: 0;
      white-space: pre-wrap;
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>Multilingual Grammar Engine</h1>
      <p style="color: var(--text-muted);">စကားလုံးရိုက်ထည့်၍ သဒ္ဒါဖွဲ့စည်းပုံ (SVO/SOV) စမ်းသပ်စစ်ဆေးရန်</p>
    </header>

    <!-- Interactive Search Bar Section -->
    <div class="search-box">
      <div class="input-group">
        <input type="text" id="searchInput" placeholder="စကားလုံး ရိုက်ထည့်ပါ (ဥပမာ- ခွေ, စားသည်, rice, N001)...">
        <button id="searchBtn">စစ်ဆေးမည်</button>
      </div>
      <div class="quick-tags">
        <span>နမူနာများ:</span>
        <button class="tag-btn" onclick="quickSearch('ခွေ')">ခွေ (Pa'O)</button>
        <button class="tag-btn" onclick="quickSearch('ထမင်း')">ထမင်း (Myanmar)</button>
        <button class="tag-btn" onclick="quickSearch('eat')">eat (English)</button>
      </div>
    </div>

    <!-- Output Container -->
    <div id="output"></div>
  </div>

  <script type="module">
    let lexicons = { nouns: {}, verbs: {}, particles: {} };

    // 1. Data Fetcher from Database JSON
    async function loadLexicons() {
      try {
        lexicons.nouns = await fetch('./data/languages/multilingual/nouns.json').then(r => r.json());
        lexicons.verbs = await fetch('./data/languages/multilingual/verbs.json').then(r => r.json());
        lexicons.particles = await fetch('./data/languages/multilingual/particles.json').then(r => r.json());
      } catch (err) {
        console.error("Lexicon database path error", err);
      }
    }

    // 2. Multilingual Search Engine
    function searchWord(keyword) {
      keyword = keyword.trim().toLowerCase();
      if (!keyword) return null;

      const allEntries = { ...lexicons.nouns, ...lexicons.verbs, ...lexicons.particles };
      
      for (const [id, entry] of Object.entries(allEntries)) {
        if (
          id.toLowerCase() === keyword ||
          entry.pao?.text === keyword ||
          entry.my?.text === keyword ||
          entry.en?.text?.toLowerCase() === keyword
        ) {
          return { id, ...entry };
        }
      }
      return null;
    }

    // 3. UI Realizer Render
    function handleSearch() {
      const inputVal = document.getElementById('searchInput').value;
      const result = searchWord(inputVal);

      if (!result) {
        document.getElementById('output').innerHTML = `
          <div class="card" style="border-color: #ef4444;">
            <p style="color: #ef4444; margin: 0;">❌ "${inputVal}" အတွက် ဒေတာဘေ့စ်ထဲတွင် စကားလုံးမတွေ့ရှိပါ။ အခြားစကားလုံး စမ်းသပ်ကြည့်ပါ။</p>
          </div>`;
        return;
      }

      document.getElementById('output').innerHTML = `
        <div class="card pao">
          <div class="card-header">
            <b>၁။ ပအိုဝ်းဘာသာ (Pa'O)</b>
            <span class="badge">SVO Pattern</span>
          </div>
          <p><b>သဒ္ဒါအမျိုးအစား:</b> ${result.pos || result.type}</p>
          <pre>စကားလုံး: ${result.pao?.text || result.pao?.marker || '-'}</pre>
        </div>

        <div class="card my">
          <div class="card-header">
            <b>၂။ မြန်မာဘာသာ (Myanmar)</b>
            <span class="badge">SOV Pattern</span>
          </div>
          <p><b>သဒ္ဒါအမျိုးအစား:</b> ${result.pos || result.type}</p>
          <pre>စကားလုံး: ${result.my?.text || result.my?.marker || '-'}</pre>
        </div>

        <div class="card en">
          <div class="card-header">
            <b>၃။ အင်္ဂလိပ်ဘာသာ (English)</b>
            <span class="badge">SVO Pattern</span>
          </div>
          <p><b>သဒ္ဒါအမျိုးအစား:</b> ${result.pos || result.type}</p>
          <pre>Word: ${result.en?.text || result.en?.marker || '-'}</pre>
        </div>
      `;
    }

    // Event Listeners
    document.getElementById('searchBtn').addEventListener('click', handleSearch);
    document.getElementById('searchInput').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') handleSearch();
    });

    window.quickSearch = function(word) {
      document.getElementById('searchInput').value = word;
      handleSearch();
    };

    // Initialize Engine
    loadLexicons();
  </script>
</body>
</html>
