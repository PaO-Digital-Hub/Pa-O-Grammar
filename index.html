<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart Multilingual Grammar Parser</title>
  <style>
    :root {
      --bg-color: #0b0f19;
      --card-bg: rgba(23, 31, 51, 0.7);
      --card-border: rgba(255, 255, 255, 0.1);
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
      --accent-pao: #10b981;
      --accent-my: #f59e0b;
      --accent-en: #3b82f6;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      padding: 30px 15px;
      display: flex;
      justify-content: center;
    }

    .container { max-width: 900px; width: 100%; }
    
    header { text-align: center; margin-bottom: 25px; }
    h1 {
      font-size: 2.2rem;
      background: linear-gradient(135deg, #a7f3d0, #3b82f6);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 8px;
    }

    .search-box {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 25px;
    }

    .input-group {
      display: flex;
      gap: 10px;
      margin-bottom: 12px;
    }

    input[type="text"] {
      flex: 1;
      background: #050811;
      border: 1px solid var(--card-border);
      border-radius: 8px;
      padding: 12px 16px;
      color: #fff;
      font-size: 1.05rem;
      outline: none;
    }

    input[type="text"]:focus {
      border-color: #3b82f6;
      box-shadow: 0 0 8px rgba(59, 130, 246, 0.4);
    }

    button {
      background: linear-gradient(135deg, #2563eb, #1d4ed8);
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 12px 24px;
      font-weight: 600;
      cursor: pointer;
    }

    .quick-tags {
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    .tag-btn {
      background: rgba(255,255,255,0.05);
      border: 1px solid var(--card-border);
      border-radius: 15px;
      padding: 4px 12px;
      color: #d1d5db;
      cursor: pointer;
    }

    .card {
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 18px;
      margin-bottom: 15px;
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--card-border);
      padding-bottom: 8px;
      margin-bottom: 12px;
    }

    .badge {
      font-size: 0.75rem;
      padding: 4px 10px;
      border-radius: 4px;
      font-weight: bold;
    }

    .pao .badge { background: rgba(16, 185, 129, 0.2); color: var(--accent-pao); border: 1px solid var(--accent-pao); }
    .my .badge { background: rgba(245, 158, 11, 0.2); color: var(--accent-my); border: 1px solid var(--accent-my); }
    .en .badge { background: rgba(59, 130, 246, 0.2); color: var(--accent-en); border: 1px solid var(--accent-en); }

    pre {
      background: #050811;
      padding: 12px 16px;
      border-radius: 8px;
      color: #e5e7eb;
      font-size: 1.1rem;
      margin: 5px 0;
      white-space: pre-wrap;
    }

    .tokens-debug {
      background: rgba(255,255,255,0.03);
      padding: 10px;
      border-radius: 6px;
      margin-bottom: 15px;
      font-size: 0.9rem;
      color: #a7f3d0;
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>Multilingual Smart Grammar Parser</h1>
      <p style="color: var(--text-muted);">စာလုံးပူး/ခြား မည်သို့ပင်ရေးစေကာမူ စာကြောင်းမှ သဒ္ဒါဖွဲ့စည်းပုံကို အလိုအလျောက် ခွဲခြားပေးသည်</p>
    </header>

    <div class="search-box">
      <div class="input-group">
        <input type="text" id="searchInput" placeholder="မည်သည့် စာကြောင်းမဆို ရိုက်ထည့်ပါ...">
        <button id="searchBtn">စစ်ဆေးမည်</button>
      </div>
      <div class="quick-tags">
        <span>နမူနာများ:</span>
        <button class="tag-btn" onclick="quickTest('ခွေသွဉ်းအံႏဒဲဉ်သွူ')">ခွေသွဉ်းအံႏဒဲဉ်သွူ (ပူးရေး)</button>
        <button class="tag-btn" onclick="quickTest('ခွေသွဉ် အံႏ ဒဲဉ် သွူ')">ခွေသွဉ် အံႏ ဒဲဉ် သွူ (ခြားရေး)</button>
        <button class="tag-btn" onclick="quickTest('ကျွန်တော်ထမင်းစားတယ်')">ကျွန်တော်ထမင်းစားတယ် (မြန်မာ)</button>
      </div>
    </div>

    <div id="output"></div>
  </div>

  <script type="module">
    let dbLexicons = [];

    // ၁။ Database load လုပ်ခြင်း
    async function initDatabase() {
      try {
        const nouns = await fetch('./data/languages/multilingual/nouns.json').then(r => r.json());
        const verbs = await fetch('./data/languages/multilingual/verbs.json').then(r => r.json());
        const particles = await fetch('./data/languages/multilingual/particles.json').then(r => r.json());
        const verbMarkers = await fetch('./data/languages/multilingual/verb-markers.json').then(r => r.json());

        // စကားလုံး ရှာဖွေရလွယ်ကူအောင် Flat List အဖြစ် ပြောင်းလဲခြင်း
        const all = { ...nouns, ...verbs, ...particles, ...verbMarkers };
        for (const [id, item] of Object.entries(all)) {
          dbLexicons.push({ id, ...item });
        }
      } catch (err) {
        console.error("Database connection failed", err);
      }
    }

    // ၂။ Maximal Matching Algorithm (စာလုံးပူးများကို အလိုအလျောက် ခွဲထုတ်ပေးသည့် စနစ်)
    function tokenizeInput(inputText) {
      let text = inputText.trim().replace(/[။၊.]/g, ''); // ပုဒ်ဖြတ်မှတ်များ ဖယ်ထုတ်ခြင်း
      const matchedTokens = [];

      while (text.length > 0) {
        let matched = false;

        // အရှည်ဆုံး စကားလုံးမှ စတင်၍ ရှာဖွေခြင်း (Maximal Matching)
        for (let len = text.length; len > 0; len--) {
          const sub = text.substring(0, len).trim();
          if (!sub) continue;

          const entry = dbLexicons.find(item => 
            item.pao?.text === sub || item.pao?.marker === sub ||
            item.my?.text === sub || item.my?.marker === sub ||
            item.en?.text?.toLowerCase() === sub.toLowerCase()
          );

          if (entry) {
            matchedTokens.push({ matchedText: sub, data: entry });
            text = text.substring(len).trim();
            matched = true;
            break;
          }
        }

        // စကားလုံး မတွေ့ပါက ၁ လုံးချင်း စီစဉ်ဖြတ်တောက်သွားမည်
        if (!matched) {
          text = text.substring(1).trim();
        }
      }

      return matchedTokens;
    }

    // ၃။ သဒ္ဒါဖွဲ့စည်းပုံ ခွဲခြား ပြန်လည်စီစဉ်ပေးခြင်း Engine
    function parseAndRender() {
      const input = document.getElementById('searchInput').value;
      const tokens = tokenizeInput(input);

      if (tokens.length === 0) {
        document.getElementById('output').innerHTML = `
          <div class="card" style="border-color: #ef4444;">
            <p style="color: #ef4444; margin:0;">❌ ထည့်သွင်းထားသော စာသားများအတွက် ဒေတာဘေ့စ်ထဲတွင် ကိုက်ညီသည့် စကားလုံးမတွေ့ပါ။</p>
          </div>`;
        return;
      }

      // POS အလိုက် သီးခြားခွဲထုတ်ခြင်း
      const subjects = tokens.filter(t => t.data.pos === 'PRON' || t.data.pos === 'NOUN');
      const verbs = tokens.filter(t => t.data.pos === 'VERB');
      const markers = tokens.filter(t => t.data.function || t.data.type);

      // SVO (Pa'O / English) နှင့် SOV (Myanmar) ဖွဲ့စည်းမှု ခွဲထုတ်ခြင်း
      const paoText = tokens.map(t => t.data.pao?.text || t.data.pao?.marker || '').join(' ');
      const myText = tokens.map(t => t.data.my?.text || t.data.my?.marker || '').join(' ');
      const enText = tokens.map(t => t.data.en?.text || t.data.en?.marker || '').join(' ');

      const debugTokens = tokens.map(t => `[${t.matchedText} → ${t.data.pos || t.data.function || 'PARTICLE'}]`).join(' ');

      document.getElementById('output').innerHTML = `
        <div class="tokens-debug">
          <b>🔍 အလိုအလျောက် ခွဲထုတ်ရရှိသော စကားလုံးများ (Tokenized):</b><br>${debugTokens}
        </div>

        <div class="card pao">
          <div class="card-header">
            <b>၁။ ပအိုဝ်းဘာသာ (Pa'O) - Structural Order</b>
            <span class="badge">SVO Structure</span>
          </div>
          <pre>ခွဲထုတ်ရရှိသော ဝါကျအမှန်: ${paoText}</pre>
        </div>

        <div class="card my">
          <div class="card-header">
            <b>၂။ မြန်မာဘာသာ (Myanmar) - Structural Order</b>
            <span class="badge">SOV Structure</span>
          </div>
          <pre>ခွဲထုတ်ရရှိသော ဝါကျအမှန်: ${myText}</pre>
        </div>

        <div class="card en">
          <div class="card-header">
            <b>၃။ အင်္ဂလိပ်ဘာသာ (English) - Structural Order</b>
            <span class="badge">SVO Structure</span>
          </div>
          <pre>ခွဲထုတ်ရရှိသော ဝါကျအမှန်: ${enText}</pre>
        </div>
      `;
    }

    // Event Listeners
    document.getElementById('searchBtn').addEventListener('click', parseAndRender);
    document.getElementById('searchInput').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') parseAndRender();
    });

    window.quickTest = function(str) {
      document.getElementById('searchInput').value = str;
      parseAndRender();
    };

    initDatabase();
  </script>
</body>
</html>
