<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trilingual Grammar & Particle Engine</title>
  <style>
    :root {
      --bg-color: #0b0f19;
      --card-bg: rgba(23, 31, 51, 0.7);
      --card-border: rgba(255, 255, 255, 0.1);
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
      --accent-pao: #10b981;
      --accent-my: #f59e0b;
      --accent-en: #3b82f6;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      padding: 30px 15px;
      display: flex;
      justify-content: center;
    }

    .container { max-width: 900px; width: 100%; }
    header { text-align: center; margin-bottom: 25px; }
    h1 {
      font-size: 2rem;
      background: linear-gradient(135deg, #a7f3d0, #3b82f6);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .search-box {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 25px;
    }

    .input-group {
      display: flex;
      gap: 10px;
      margin-bottom: 12px;
    }

    input[type="text"] {
      flex: 1;
      background: #050811;
      border: 1px solid var(--card-border);
      border-radius: 8px;
      padding: 12px 16px;
      color: #fff;
      font-size: 1rem;
      outline: none;
    }

    button {
      background: linear-gradient(135deg, #2563eb, #1d4ed8);
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 12px 24px;
      font-weight: 600;
      cursor: pointer;
    }

    .card {
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 18px;
      margin-bottom: 15px;
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--card-border);
      padding-bottom: 8px;
      margin-bottom: 12px;
    }

    .badge {
      font-size: 0.75rem;
      padding: 4px 10px;
      border-radius: 4px;
      font-weight: bold;
    }

    .pao .badge { background: rgba(16, 185, 129, 0.2); color: var(--accent-pao); border: 1px solid var(--accent-pao); }
    .my .badge { background: rgba(245, 158, 11, 0.2); color: var(--accent-my); border: 1px solid var(--accent-my); }
    .en .badge { background: rgba(59, 130, 246, 0.2); color: var(--accent-en); border: 1px solid var(--accent-en); }

    pre {
      background: #050811;
      padding: 12px 16px;
      border-radius: 8px;
      color: #e5e7eb;
      font-size: 1.1rem;
      margin: 5px 0;
      white-space: pre-wrap;
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>Multilingual Grammar Engine</h1>
      <p style="color: var(--text-muted);">Particles & Verb-Markers သီးခြားစီ ခွဲခြားစစ်ဆေးသည့် စနစ်</p>
    </header>

    <div class="search-box">
      <div class="input-group">
        <input type="text" id="searchInput" placeholder="ဥပမာ - ကျွန်တော် ထမင်း ကို စား သည် ...">
        <button id="searchBtn">စစ်ဆေးမည်</button>
      </div>
    </div>

    <div id="output"></div>
  </div>

  <script type="module">
    let dbLexicons = [];

    async function initDatabase() {
      try {
        const nouns = await fetch('./data/languages/multilingual/nouns.json').then(r => r.json());
        const verbs = await fetch('./data/languages/multilingual/verbs.json').then(r => r.json());
        const particles = await fetch('./data/languages/multilingual/particles.json').then(r => r.json());
        const verbMarkers = await fetch('./data/languages/multilingual/verb-markers.json').then(r => r.json());

        const all = { ...nouns, ...verbs, ...particles, ...verbMarkers };
        for (const [id, item] of Object.entries(all)) {
          dbLexicons.push({ id, ...item });
        }
      } catch (err) {
        console.error("Database connection failed", err);
      }
    }

    function tokenizeInput(inputText) {
      let text = inputText.trim().replace(/[။၊.]/g, '');
      const matchedTokens = [];

      while (text.length > 0) {
        let matched = false;

        for (let len = text.length; len > 0; len--) {
          const sub = text.substring(0, len).trim();
          if (!sub) continue;

          const entry = dbLexicons.find(item => 
            item.pao?.text === sub || item.pao?.marker === sub ||
            item.my?.text === sub || item.my?.marker === sub ||
            item.en?.text?.toLowerCase() === sub.toLowerCase()
          );

          if (entry) {
            matchedTokens.push(entry);
            text = text.substring(len).trim();
            matched = true;
            break;
          }
        }

        if (!matched) text = text.substring(1).trim();
      }

      return matchedTokens;
    }

    // Grammar Re-ordering Engine (Particles နှင့် Verb Markers များကို တိကျစွာ ခွဲခြားခြင်း)
    function buildGrammarSentence(tokens, lang) {
      const subj = tokens.find(t => t.pos === 'PRON' || (t.pos === 'NOUN' && t.id.startsWith('N001')));
      const obj = tokens.find(t => t.pos === 'NOUN' && !t.id.startsWith('N001'));
      const verb = tokens.find(t => t.pos === 'VERB');
      
      // Particles (ဝိဘတ်များ) နှင့် Verb Markers (ကြိယာအဆုံးသတ်များ) ကို သီးခြားစီ ခွဲထုတ်ခြင်း
      const objParticle = tokens.find(t => t.category === 'OBJECT_MARKER' || t.category === 'SUBJECT_MARKER');
      const verbMarker = tokens.find(t => t.function || t.pos === 'VERB_MARKER');

      const getWord = (item) => item ? (item[lang]?.text || item[lang]?.marker || '') : '';

      // ဘာသာစကားအလိုက် သဒ္ဒါကျအောင် စီစဉ်ခြင်း
      if (lang === 'my') {
        // မြန်မာ (SOV): [Subject] + [Object + Object Marker] + [Verb + Verb Marker]
        const s = getWord(subj);
        const o = getWord(obj);
        const op = getWord(objParticle);
        const v = getWord(verb);
        const vm = getWord(verbMarker);

        return `${s} ${o}${op} ${v}${vm}`.trim();
      } 
      else if (lang === 'pao') {
        // ပအိုဝ်း (SVO): [Subject] + [Verb] + [Object + Object Marker] + [Verb Marker]
        const s = getWord(subj);
        const v = getWord(verb);
        const o = getWord(obj);
        const op = getWord(objParticle);
        const vm = getWord(verbMarker);

        return `${s} ${v} ${o} ${op} ${vm}`.trim();
      } 
      else {
        // အင်္ဂလိပ် (SVO): [Subject] + [Verb] + [Object]
        const s = getWord(subj);
        const v = getWord(verb);
        const o = getWord(obj);

        return `${s} ${v} ${o}`.trim();
      }
    }

    function parseAndRender() {
      const input = document.getElementById('searchInput').value;
      const tokens = tokenizeInput(input);

      if (tokens.length === 0) {
        document.getElementById('output').innerHTML = `<p style="color:red;">❌ မတွေ့ပါ။</p>`;
        return;
      }

      document.getElementById('output').innerHTML = `
        <div class="card pao">
          <div class="card-header"><b>၁။ ပအိုဝ်းဘာသာ (Pa'O)</b><span class="badge">SVO</span></div>
          <pre>${buildGrammarSentence(tokens, 'pao')}</pre>
        </div>

        <div class="card my">
          <div class="card-header"><b>၂။ မြန်မာဘာသာ (Myanmar)</b><span class="badge">SOV</span></div>
          <pre>${buildGrammarSentence(tokens, 'my')}</pre>
        </div>

        <div class="card en">
          <div class="card-header"><b>၃။ အင်္ဂလိပ်ဘာသာ (English)</b><span class="badge">SVO</span></div>
          <pre>${buildGrammarSentence(tokens, 'en')}</pre>
        </div>
      `;
    }

    document.getElementById('searchBtn').addEventListener('click', parseAndRender);
    document.getElementById('searchInput').addEventListener('keypress', (e) => { if (e.key === 'Enter') parseAndRender(); });

    initDatabase();
  </script>
</body>
</html>
