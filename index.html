<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trilingual Grammar Interactive Tester</title>
  <style>
    :root {
      --bg-color: #0b0f19;
      --card-bg: rgba(23, 31, 51, 0.7);
      --card-border: rgba(255, 255, 255, 0.08);
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
      --accent-pao: #10b981;
      --accent-my: #f59e0b;
      --accent-en: #3b82f6;
      --input-bg: #121829;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      padding: 30px 15px;
      display: flex;
      justify-content: center;
    }

    .container { max-width: 900px; width: 100%; }
    header { text-align: center; margin-bottom: 25px; }
    
    h1 {
      font-size: 2.2rem;
      background: linear-gradient(135deg, #a7f3d0, #3b82f6);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 5px;
    }

    /* Interactive Input Panel */
    .input-card {
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      padding: 20px;
      margin-bottom: 25px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.4);
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 15px;
      margin-bottom: 15px;
    }

    .input-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    label {
      font-size: 0.85rem;
      color: var(--text-muted);
      font-weight: 600;
    }

    input, select {
      background: var(--input-bg);
      border: 1px solid var(--card-border);
      border-radius: 8px;
      padding: 10px 12px;
      color: var(--text-main);
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s;
    }

    input:focus, select:focus {
      border-color: var(--accent-en);
    }

    button.btn-parse {
      width: 100%;
      background: linear-gradient(135deg, #10b981, #3b82f6);
      border: none;
      border-radius: 8px;
      padding: 12px;
      color: #fff;
      font-weight: bold;
      font-size: 1rem;
      cursor: pointer;
      transition: opacity 0.2s;
    }

    button.btn-parse:hover { opacity: 0.9; }

    /* Results Layout */
    .card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 18px;
      margin-bottom: 15px;
    }

    .lang-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
      border-bottom: 1px solid var(--card-border);
      padding-bottom: 8px;
    }

    .badge {
      font-size: 0.75rem;
      padding: 3px 10px;
      border-radius: 20px;
      font-weight: bold;
    }

    .pao .badge { background: rgba(16, 185, 129, 0.2); color: var(--accent-pao); border: 1px solid var(--accent-pao); }
    .my .badge { background: rgba(245, 158, 11, 0.2); color: var(--accent-my); border: 1px solid var(--accent-my); }
    .en .badge { background: rgba(59, 130, 246, 0.2); color: var(--accent-en); border: 1px solid var(--accent-en); }

    pre {
      background: #050811;
      padding: 14px;
      border-radius: 8px;
      color: #e5e7eb;
      font-size: 1.05rem;
      margin: 0;
      white-space: pre-wrap;
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>Multilingual Grammar Engine</h1>
      <p style="color: var(--text-muted);">Interactive Linguistic Sandbox (Pa'O • Myanmar • English)</p>
    </header>

    <!-- Interactive Input Control -->
    <div class="input-card">
      <div class="form-grid">
        <div class="input-group">
          <label>Subject (ကတ္တား)</label>
          <input type="text" id="subjInput" value="ခွေ / ကျွန်တော် / I">
        </div>

        <div class="input-group">
          <label>Verb (ကြိယာ)</label>
          <input type="text" id="verbInput" value="အံႏ / စားသည် / eat">
        </div>

        <div class="input-group">
          <label>Object (ကံ)</label>
          <input type="text" id="objInput" value="ဒဲဉ် / ထမင်း / rice">
        </div>

        <div class="input-group">
          <label>Object Particle (ကံဝိဘတ်)</label>
          <select id="particleInput">
            <option value="NONE">None (မပါပါ)</option>
            <option value="ACCUSATIVE">ကို / ယို (Accusative)</option>
            <option value="TOPIC">သည် / နဝ်ꩻ (Topic)</option>
          </select>
        </div>
      </div>

      <button class="btn-parse" id="parseBtn">Analyze & Transform Syntax</button>
    </div>

    <!-- Output Container -->
    <div id="output"></div>
  </div>

  <script type="module">
    class SyntaxEngine {
      parse(subj, verb, obj, particle) {
        // Particle Resolution mapping
        let myPart = particle === 'ACCUSATIVE' ? 'ကို' : (particle === 'TOPIC' ? 'သည်' : '');
        let paoPart = particle === 'ACCUSATIVE' ? 'ယို' : (particle === 'TOPIC' ? 'နဝ်ꩻ' : '');

        return {
          pao: {
            order: "SVO",
            pattern: "[S] Subject → [V] Verb → [O] Object + [P] Particle",
            text: `${subj} ${verb} ${obj} ${paoPart}`.trim()
          },
          my: {
            order: "SOV",
            pattern: "[S] Subject → [O] Object + [P] Particle → [V] Verb",
            text: `${subj} ${obj}${myPart} ${verb}`.trim()
          },
          en: {
            order: "SVO",
            pattern: "[S] Subject → [V] Verb → [O] Object",
            text: `${subj} ${verb} ${obj}`.trim()
          }
        };
      }
    }

    const engine = new SyntaxEngine();

    function renderOutput() {
      const s = document.getElementById('subjInput').value || '-';
      const v = document.getElementById('verbInput').value || '-';
      const o = document.getElementById('objInput').value || '-';
      const p = document.getElementById('particleInput').value;

      const res = engine.parse(s, v, o, p);

      document.getElementById('output').innerHTML = `
        <div class="card pao">
          <div class="lang-header">
            <b>၁။ ပအိုဝ်းဘာသာ (Pa'O)</b>
            <span class="badge">${res.pao.order}</span>
          </div>
          <p style="font-size: 0.85rem; color: var(--text-muted); margin-bottom: 8px;"><b>ဝါကျ တည်ဆောက်ပုံ:</b> ${res.pao.pattern}</p>
          <pre>${res.pao.text}</pre>
        </div>

        <div class="card my">
          <div class="lang-header">
            <b>၂။ မြန်မာဘာသာ (Myanmar)</b>
            <span class="badge">${res.my.order}</span>
          </div>
          <p style="font-size: 0.85rem; color: var(--text-muted); margin-bottom: 8px;"><b>ဝါကျ တည်ဆောက်ပုံ:</b> ${res.my.pattern}</p>
          <pre>${res.my.text}</pre>
        </div>

        <div class="card en">
          <div class="lang-header">
            <b>၃။ အင်္ဂလိပ်ဘာသာ (English)</b>
            <span class="badge">${res.en.order}</span>
          </div>
          <p style="font-size: 0.85rem; color: var(--text-muted); margin-bottom: 8px;"><b>ဝါကျ တည်ဆောက်ပုံ:</b> ${res.en.pattern}</p>
          <pre>${res.en.text}</pre>
        </div>
      `;
    }

    // Initial Load & Event Listener
    document.getElementById('parseBtn').addEventListener('click', renderOutput);
    renderOutput();
  </script>
</body>
</html>
