<!DOCTYPE html>
<html lang="blk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trilingual Grammar Engine</title>
  <style>
    :root {
      --bg-color: #0b0f19;
      --card-bg: rgba(23, 31, 51, 0.7);
      --card-border: rgba(255, 255, 255, 0.08);
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
      --accent-pao: #10b981;
      --accent-my: #f59e0b;
      --accent-en: #3b82f6;
      --code-bg: #050811;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      margin: 0;
      padding: 30px 15px;
      display: flex;
      justify-content: center;
    }

    .container {
      max-width: 850px;
      width: 100%;
    }

    header {
      text-align: center;
      margin-bottom: 30px;
    }

    h1 {
      font-size: 2.2rem;
      background: linear-gradient(135deg, #a7f3d0, #3b82f6);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 8px;
    }

    p.subtitle {
      color: var(--text-muted);
      font-size: 0.95rem;
    }

    .card {
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      padding: 20px;
      margin-bottom: 20px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .card:hover {
      transform: translateY(-2px);
      box-shadow: 0 14px 30px rgba(0, 0, 0, 0.4);
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--card-border);
      padding-bottom: 12px;
      margin-bottom: 15px;
    }

    .lang-title {
      font-size: 1.25rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .badge {
      font-size: 0.75rem;
      padding: 4px 10px;
      border-radius: 20px;
      font-weight: 700;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }

    /* Color variations for languages */
    .pao .badge { background: rgba(16, 185, 129, 0.15); color: var(--accent-pao); border: 1px solid var(--accent-pao); }
    .my .badge { background: rgba(245, 158, 11, 0.15); color: var(--accent-my); border: 1px solid var(--accent-my); }
    .en .badge { background: rgba(59, 130, 246, 0.15); color: var(--accent-en); border: 1px solid var(--accent-en); }

    .grammar-pattern {
      font-size: 0.9rem;
      color: var(--text-muted);
      margin-bottom: 12px;
    }

    pre {
      background: var(--code-bg);
      border: 1px solid var(--card-border);
      border-radius: 8px;
      padding: 14px 16px;
      color: #e5e7eb;
      font-family: 'Consolas', 'Courier New', monospace;
      font-size: 1.05rem;
      margin: 0;
      white-space: pre-wrap;
      word-break: break-word;
    }

    #loading {
      text-align: center;
      padding: 40px;
      color: var(--text-muted);
      font-size: 1.1rem;
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>Multilingual Grammar Engine</h1>
      <p class="subtitle">Unified Lexicon & Syntax Parser (Pa'O • Myanmar • English)</p>
    </header>

    <div id="output">
      <div id="loading">Processing Language Pipelines...</div>
    </div>
  </div>

  <script type="module">
    class MultilingualRealizer {
      realize(semanticNodes, lexicons) {
        const subj = lexicons.nouns[semanticNodes.subject];
        const verb = lexicons.verbs[semanticNodes.verb];
        const obj = lexicons.nouns[semanticNodes.object];

        return {
          pao: {
            name: "ပအိုဝ်းဘာသာ (Pa'O)",
            order: "SVO",
            pattern: "[S] Subject → [V] Verb → [O] Object",
            text: `${subj.pao.text} ${verb.pao.text} ${obj.pao.text}`
          },
          my: {
            name: "မြန်မာဘာသာ (Myanmar)",
            order: "SOV",
            pattern: "[S] Subject → [O] Object → [V] Verb",
            text: `${subj.my.text} ${obj.my.text} ${verb.my.text}`
          },
          en: {
            name: "အင်္ဂလိပ်ဘာသာ (English)",
            order: "SVO",
            pattern: "[S] Subject → [V] Verb → [O] Object",
            text: `${subj.en.text} ${verb.en.text} ${obj.en.text}`
          }
        };
      }
    }

    async function runEngine() {
      try {
        const nouns = await fetch('./data/languages/multilingual/nouns.json').then(r => r.json());
        const verbs = await fetch('./data/languages/multilingual/verbs.json').then(r => r.json());

        const realizer = new MultilingualRealizer();
        const inputAST = { subject: "N001", verb: "V001", object: "N002" };
        const res = realizer.realize(inputAST, { nouns, verbs });

        document.getElementById('output').innerHTML = `
          <div class="card pao">
            <div class="card-header">
              <div class="lang-title">${res.pao.name}</div>
              <span class="badge">${res.pao.order}</span>
            </div>
            <div class="grammar-pattern"><b>ဝါကျ တည်ဆောက်ပုံ:</b> ${res.pao.pattern}</div>
            <pre>${res.pao.text}</pre>
          </div>

          <div class="card my">
            <div class="card-header">
              <div class="lang-title">${res.my.name}</div>
              <span class="badge">${res.my.order}</span>
            </div>
            <div class="grammar-pattern"><b>ဝါကျ တည်ဆောက်ပုံ:</b> ${res.my.pattern}</div>
            <pre>${res.my.text}</pre>
          </div>

          <div class="card en">
            <div class="card-header">
              <div class="lang-title">${res.en.name}</div>
              <span class="badge">${res.en.order}</span>
            </div>
            <div class="grammar-pattern"><b>ဝါကျ တည်ဆောက်ပုံ:</b> ${res.en.pattern}</div>
            <pre>${res.en.text}</pre>
          </div>
        `;
      } catch (err) {
        document.getElementById('output').innerHTML = `
          <div class="card" style="border-color: #ef4444;">
            <h3 style="color: #ef4444; margin-top: 0;">Lexicon Error</h3>
            <p>${err.message}</p>
          </div>`;
      }
    }

    runEngine();
  </script>
</body>
</html>
