<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Advanced Multilingual Grammar Engine</title>
  <style>
    body { font-family: monospace; background: #121212; color: #00ff66; padding: 20px; }
    pre { background: #1e1e1e; padding: 15px; border-radius: 5px; color: #fff; white-space: pre-wrap; }
    h2 { color: #00e1ff; }
  </style>
</head>
<body>
  <h1>Pa'O Grammar Engine</h1>
  <div id="output">Processing Pipeline...</div>

  <script type="module">
    import { Tokenizer } from './src/core/tokenizer.js';
    import { POSTagger } from './src/core/pos-tagger.js';
    import { ConstituencyParser } from './src/syntax/phrase-structure/constituency-parser.js';
    import { DependencyParser } from './src/syntax/dependency/dependency-parser.js';
    import { RuleEngine } from './src/grammar-engine/rule-engine.js';
    import { SemanticParser } from './src/semantics/semantic-parser.js';
    import { SentenceGenerator } from './src/generation/sentence-generator.js';

    async function initEngine() {
      try {
        // Fetch JSON files safely (Fixes import assertion errors)
        const paoProfile = await fetch('./src/languages/pao/language-profile.json').then(r => r.json());
        const myProfile = await fetch('./src/languages/myanmar/language-profile.json').then(r => r.json());
        const paoNouns = await fetch('./data/languages/pao/nouns.json').then(r => r.json());
        const paoVerbs = await fetch('./data/languages/pao/verbs.json').then(r => r.json());

        const tokenizer = new Tokenizer();
        const tagger = new POSTagger({ ...paoNouns, ...paoVerbs });
        const constParser = new ConstituencyParser();
        const depParser = new DependencyParser();
        const ruleEngine = new RuleEngine();
        const semanticParser = new SemanticParser();
        const generator = new SentenceGenerator();

        const paoText = "ခွေ အံႏ ဒဲန်";
        const tokens = tokenizer.tokenize(paoText, 'pao');
        const tagged = tagger.tag(tokens);
        const constTree = constParser.parse(tagged, paoProfile);
        const depTopology = depParser.parse(tagged, paoProfile);
        const semIR = semanticParser.parse(tagged, paoProfile);

        const engineResult = ruleEngine.process(tagged, paoProfile, myProfile);
        const generatedMyanmarSentence = generator.generate(semIR, myProfile);

        document.getElementById('output').innerHTML = `
          <h2>1. Input Sentence (Pa'O SVO)</h2>
          <pre>${paoText}</pre>

          <h2>2. POS Tagged Tokens</h2>
          <pre>${JSON.stringify(tagged, null, 2)}</pre>

          <h2>3. Transformed Tokens (Pa'O SVO -> Myanmar SOV)</h2>
          <pre>${JSON.stringify(engineResult.transformedTokens, null, 2)}</pre>

          <h2>4. Generated Sentence</h2>
          <pre>${generatedMyanmarSentence}</pre>
        `;
      } catch (err) {
        document.getElementById('output').innerHTML = `<h2 style="color:red;">Error: ${err.message}</h2><p>Please check Console inspection for detail path issues.</p>`;
        console.error(err);
      }
    }

    initEngine();
  </script>
</body>
</html>
