<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart Multilingual Grammar Parser</title>
  <style>
    :root {
      --bg-color: #0b0f19;
      --card-bg: rgba(23, 31, 51, 0.7);
      --card-border: rgba(255, 255, 255, 0.1);
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
      --accent-pao: #10b981;
      --accent-my: #f59e0b;
      --accent-en: #3b82f6;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      padding: 30px 15px;
      display: flex;
      justify-content: center;
    }

    .container { max-width: 900px; width: 100%; }
    header { text-align: center; margin-bottom: 25px; }
    h1 {
      font-size: 2.2rem;
      background: linear-gradient(135deg, #a7f3d0, #3b82f6);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 8px;
    }

    .search-box {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 25px;
    }

    .input-group {
      display: flex;
      gap: 10px;
      margin-bottom: 12px;
    }

    input[type="text"] {
      flex: 1;
      background: #050811;
      border: 1px solid var(--card-border);
      border-radius: 8px;
      padding: 12px 16px;
      color: #fff;
      font-size: 1.05rem;
      outline: none;
    }

    input[type="text"]:focus {
      border-color: #3b82f6;
      box-shadow: 0 0 8px rgba(59, 130, 246, 0.4);
    }

    button {
      background: linear-gradient(135deg, #2563eb, #1d4ed8);
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 12px 24px;
      font-weight: 600;
      cursor: pointer;
    }

    .quick-tags {
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    .tag-btn {
      background: rgba(255,255,255,0.05);
      border: 1px solid var(--card-border);
      border-radius: 15px;
      padding: 4px 12px;
      color: #d1d5db;
      cursor: pointer;
    }

    .card {
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 18px;
      margin-bottom: 15px;
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--card-border);
      padding-bottom: 8px;
      margin-bottom: 12px;
    }

    .badge {
      font-size: 0.75rem;
      padding: 4px 10px;
      border-radius: 4px;
      font-weight: bold;
    }

    .pao .badge { background: rgba(16, 185, 129, 0.2); color: var(--accent-pao); border: 1px solid var(--accent-pao); }
    .my .badge { background: rgba(245, 158, 11, 0.2); color: var(--accent-my); border: 1px solid var(--accent-my); }
    .en .badge { background: rgba(59, 130, 246, 0.2); color: var(--accent-en); border: 1px solid var(--accent-en); }

    pre {
      background: #050811;
      padding: 12px 16px;
      border-radius: 8px;
      color: #e5e7eb;
      font-size: 1.1rem;
      margin: 5px 0;
      white-space: pre-wrap;
    }

    .tokens-debug {
      background: rgba(255,255,255,0.03);
      padding: 10px;
      border-radius: 6px;
      margin-bottom: 15px;
      font-size: 0.9rem;
      color: #a7f3d0;
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>Multilingual Smart Grammar Parser</h1>
      <p style="color: var(--text-muted);">သဒ္ဒါအလိုက် SVO / SOV စနစ်မှန်အတိုင်း အလိုအလျောက် ပြန်လည်စီစဉ်ပေးသည့် စနစ်</p>
    </header>

    <div class="search-box">
      <div class="input-group">
        <input type="text" id="searchInput" placeholder="စကားလုံး သို့မဟုတ် ဝါကျ ရိုက်ထည့်ပါ...">
        <button id="searchBtn">စစ်ဆေးမည်</button>
      </div>
      <div class="quick-tags">
        <span>နမူနာများ:</span>
        <button class="tag-btn" onclick="quickTest('အံႏ ဒဲန် သွူ')">အံႏ ဒဲန် သွူ (Pa'O SVO)</button>
        <button class="tag-btn" onclick="quickTest('စား ထမင်း သည်')">စား ထမင်း သည် (အစီအစဉ်မှား)</button>
      </div>
    </div>

    <div id="output"></div>
  </div>

  <script type="module">
    let dbLexicons = [];

    async function initDatabase() {
      try {
        const nouns = await fetch('./data/languages/multilingual/nouns.json').then(r => r.json());
        const verbs = await fetch('./data/languages/multilingual/verbs.json').then(r => r.json());
        const particles = await fetch('./data/languages/multilingual/particles.json').then(r => r.json());
        const verbMarkers = await fetch('./data/languages/multilingual/verb-markers.json').then(r => r.json());

        const all = { ...nouns, ...verbs, ...particles, ...verbMarkers };
        for (const [id, item] of Object.entries(all)) {
          dbLexicons.push({ id, ...item });
        }
      } catch (err) {
        console.error("Database connection error", err);
      }
    }

    function tokenizeInput(inputText) {
      let text = inputText.trim().replace(/[။၊.]/g, '');
      const matchedTokens = [];

      while (text.length > 0) {
        let matched = false;

        for (let len = text.length; len > 0; len--) {
          const sub = text.substring(0, len).trim();
          if (!sub) continue;

          const entry = dbLexicons.find(item => 
            item.pao?.text === sub || item.pao?.marker === sub ||
            item.my?.text === sub || item.my?.marker === sub ||
            item.en?.text?.toLowerCase() === sub.toLowerCase()
          );

          if (entry) {
            matchedTokens.push(entry);
            text = text.substring(len).trim();
            matched = true;
            break;
          }
        }

        if (!matched) text = text.substring(1).trim();
      }

      return matchedTokens;
    }

    // သဒ္ဒါအစဉ်အတိုင်း (Grammar Rule) ပြန်လည် စီစဉ်ပေးသည့် Engine
    function reorderTokens(tokens, targetLang, targetStructure) {
      const subjects = tokens.filter(t => t.pos === 'PRON' || (t.pos === 'NOUN' && t.id.startsWith('N001')));
      const objects = tokens.filter(t => t.pos === 'NOUN' && !t.id.startsWith('N001'));
      const verbs = tokens.filter(t => t.pos === 'VERB');
      const particles = tokens.filter(t => t.type || t.function);

      let ordered = [];

      if (targetStructure === 'SOV') {
        // မြန်မာ (SOV): Subject + Object + Verb + Verb Marker
        ordered = [...subjects, ...objects, ...verbs, ...particles];
      } else {
        // ပအိုဝ်း / အင်္ဂလိပ် (SVO): Subject + Verb + Object + Marker
        ordered = [...subjects, ...verbs, ...objects, ...particles];
      }

      // စကားလုံး ပြန်ထုတ်ပေးခြင်း
      return ordered
        .map(t => t[targetLang]?.text || t[targetLang]?.marker || '')
        .filter(Boolean)
        .join(' ');
    }

    function parseAndRender() {
      const input = document.getElementById('searchInput').value;
      const tokens = tokenizeInput(input);

      if (tokens.length === 0) {
        document.getElementById('output').innerHTML = `
          <div class="card" style="border-color: #ef4444;">
            <p style="color: #ef4444; margin:0;">❌ ဒေတာဘေ့စ်ထဲတွင် မတွေ့ပါ။</p>
          </div>`;
        return;
      }

      // ဘာသာစကားအလိုက် သဒ္ဒါပုံစံအမှန်သို့ Re-order လုပ်ယူခြင်း
      const paoText = reorderTokens(tokens, 'pao', 'SVO');
      const myText = reorderTokens(tokens, 'my', 'SOV');
      const enText = reorderTokens(tokens, 'en', 'SVO');

      document.getElementById('output').innerHTML = `
        <div class="card pao">
          <div class="card-header">
            <b>၁။ ပအိုဝ်းဘာသာ (Pa'O)</b>
            <span class="badge">SVO Structure</span>
          </div>
          <pre>ခွဲထုတ်ရရှိသော ဝါကျအမှန်: ${paoText}</pre>
        </div>

        <div class="card my">
          <div class="card-header">
            <b>၂။ မြန်မာဘာသာ (Myanmar)</b>
            <span class="badge">SOV Structure</span>
          </div>
          <pre>ခွဲထုတ်ရရှိသော ဝါကျအမှန်: ${myText}</pre>
        </div>

        <div class="card en">
          <div class="card-header">
            <b>၃။ အင်္ဂလိပ်ဘာသာ (English)</b>
            <span class="badge">SVO Structure</span>
          </div>
          <pre>ခွဲထုတ်ရရှိသော ဝါကျအမှန်: ${enText}</pre>
        </div>
      `;
    }

    document.getElementById('searchBtn').addEventListener('click', parseAndRender);
    document.getElementById('searchInput').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') parseAndRender();
    });

    window.quickTest = function(str) {
      document.getElementById('searchInput').value = str;
      parseAndRender();
    };

    initDatabase();
  </script>
</body>
</html>
