<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trilingual Particle & Grammar Engine</title>
  <style>
    :root {
      --bg-color: #0b0f19;
      --card-bg: rgba(23, 31, 51, 0.7);
      --card-border: rgba(255, 255, 255, 0.08);
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
      --accent-pao: #10b981;
      --accent-my: #f59e0b;
      --accent-en: #3b82f6;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      padding: 30px 15px;
      display: flex;
      justify-content: center;
    }

    .container { max-width: 900px; width: 100%; }
    header { text-align: center; margin-bottom: 25px; }
    h1 {
      font-size: 2rem;
      background: linear-gradient(135deg, #a7f3d0, #3b82f6);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .card {
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 18px;
      margin-bottom: 15px;
    }

    .lang-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      border-bottom: 1px solid var(--card-border);
      padding-bottom: 8px;
    }

    .badge {
      font-size: 0.75rem;
      padding: 3px 8px;
      border-radius: 4px;
      font-weight: bold;
    }

    .pao .badge { background: rgba(16, 185, 129, 0.2); color: var(--accent-pao); border: 1px solid var(--accent-pao); }
    .my .badge { background: rgba(245, 158, 11, 0.2); color: var(--accent-my); border: 1px solid var(--accent-my); }
    .en .badge { background: rgba(59, 130, 246, 0.2); color: var(--accent-en); border: 1px solid var(--accent-en); }

    pre {
      background: #050811;
      padding: 12px;
      border-radius: 6px;
      color: #e5e7eb;
      font-size: 1.05rem;
      margin: 5px 0;
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>Trilingual Grammar & Particle Engine</h1>
      <p style="color: var(--text-muted);">Functional Markers & Functional Suffix Resolution</p>
    </header>

    <div id="output">Loading Engine...</div>
  </div>

  <script type="module">
    class ParticleGrammarRealizer {
      // Nominalizer Transformer (လုပ် + ခြင်း)
      realizeNominalization(verbEntry, markerEntry) {
        const myVerb = verbEntry.my.text; // လုပ်
        const myMarker = markerEntry.my.marker; // ခြင်း
        
        const paoVerb = verbEntry.pao.text; // မာꩻ
        const paoMarker = markerEntry.pao.marker; // ထာꩻ
        
        const enVerb = verbEntry.en.text; // do
        const enSuffix = markerEntry.en.suffix; // ing

        return {
          my: `${myVerb}${myMarker}`,                          // လုပ်ခြင်း (AFTER_VERB)
          pao: `${paoMarker} ${paoVerb}`,                      // ထာꩻ မာꩻ (BEFORE_VERB)
          en: `${enVerb}${enSuffix}`                           // doing (ATTACH_SUFFIX)
        };
      }

      // Sentence Realizer with Object Markers
      realizeSentence(subj, verb, obj, objParticle, verbMarker, lexicons) {
        const s = lexicons.nouns[subj];
        const v = lexicons.verbs[verb];
        const o = lexicons.nouns[obj];
        const p = lexicons.particles[objParticle];
        const vm = lexicons.verbMarkers[verbMarker];

        // Myanmar (SOV): S + O + ObjMarker + V + VerbMarker
        const myStr = `${s.my.text} ${o.my.text}${p.my.text} ${v.my.text}${vm.my.marker}`;

        // Pa'O (SVO): S + V + O + ObjMarker + VerbMarker
        const paoStr = `${s.pao.text} ${v.pao.text} ${o.pao.text} ${p.pao.text} ${vm.pao.marker}`;

        // English (SVO): S + V + O
        const enStr = `${s.en.text} ${v.en.text} ${o.en.text}`;

        return { my: myStr, pao: paoStr, en: enStr };
      }
    }

    async function run() {
      try {
        const nouns = await fetch('./data/languages/multilingual/nouns.json').then(r => r.json());
        const verbs = await fetch('./data/languages/multilingual/verbs.json').then(r => r.json());
        const particles = await fetch('./data/languages/multilingual/particles.json').then(r => r.json());
        const verbMarkers = await fetch('./data/languages/multilingual/verb-markers.json').then(r => r.json());

        const realizer = new ParticleGrammarRealizer();

        // 1. Nominalization Example (လုပ် + ခြင်း)
        const nomRes = realizer.realizeNominalization(verbs["V001"], verbMarkers["VM001"]);

        // 2. Full Sentence Example (စာအုပ်ကို ယူပါ)
        const sentenceRes = realizer.realizeSentence("N001", "V001", "N002", "P003", "VM003", { nouns, verbs, particles, verbMarkers });

        document.getElementById('output').innerHTML = `
          <div class="card my">
            <div class="lang-header">
              <b>၁။ နာမ်ပြုကြိယာပုဒ် (Nominalizer Test)</b>
            </div>
            <pre>မြန်မာ: ${nomRes.my}</pre>
            <pre>ပအိုဝ်း: ${nomRes.pao}</pre>
            <pre>English: ${nomRes.en}</pre>
          </div>

          <div class="card pao">
            <div class="lang-header">
              <b>၂။ ဝိဘတ်ပါသော ဝါကျအပြည့်အစုံ (Full Particle Sentence)</b>
            </div>
            <pre>မြန်မာ (SOV): ${sentenceRes.my}</pre>
            <pre>ပအိုဝ်း (SVO): ${sentenceRes.pao}</pre>
            <pre>English (SVO): ${sentenceRes.en}</pre>
          </div>
        `;
      } catch (err) {
        document.getElementById('output').innerHTML = `<p style="color:red;">Error: ${err.message}</p>`;
      }
    }

    run();
  </script>
</body>
</html>
